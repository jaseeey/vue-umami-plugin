name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Install, audit, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      # RUN_BUNDLER_TESTS=1 enables the opt-in bundler and type-resolution
      # matrix (tests/bundlers.test.ts) — the same gate the local release
      # workflow requires before a version bump. Setup packs the repository
      # and installs the latest vite, esbuild, webpack, and typescript into a
      # throwaway consumer, so it also acts as a canary against upstream
      # tooling drift.
      - name: Run tests including bundler matrix
        run: RUN_BUNDLER_TESTS=1 npm test

      - name: Build package
        run: npm run build
